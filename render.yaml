services:
  - type: web
    name: tenant-auditor
    runtime: python
    buildCommand: pip install -r requirements.txt
    # One worker, several threads. Run progress lives in a module-level dict and
    # audits execute in background threads, so a second worker process would get
    # its own copy and progress polls would hit the wrong one at random. Threads
    # keep request concurrency without splitting that state — and keep SQLite to
    # a single writer.
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: DATA_DIR
        value: /var/data
      # Keep the database on the persistent disk. Without this the default
      # relative URI resolves into Flask's instance folder, which is ephemeral,
      # and every redeploy silently starts the audit history over.
      - key: DATABASE_URL
        value: sqlite:////var/data/tenant_auditor.db
      - key: SECRET_KEY
        # Generated once and kept. Changing it invalidates every session AND
        # makes stored tenant secrets undecryptable — they'd need re-entering.
        generateValue: true
      # Render terminates TLS, so the session cookie must be HTTPS-only.
      # Without this it is sent in the clear on any non-TLS request.
      - key: SESSION_COOKIE_SECURE
        value: "true"
    disk:
      name: tenant-data
      mountPath: /var/data
      sizeGB: 1

# Scheduled audits are deliberately NOT a separate Render cron service. A Render
# disk attaches to exactly one service, so a cron job would get its own empty
# filesystem and its own empty SQLite database — it would audit nothing and mail
# a digest saying so. On a host where one machine holds both (a VPS, or your own
# machine) the crontab in the README is the right answer. On Render, either move
# to Postgres so both services can reach the same data, or trigger the run over
# HTTP from an external scheduler.
