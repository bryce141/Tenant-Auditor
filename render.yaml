services:
  - type: web
    name: tenant-auditor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: tenant-data
      mountPath: /var/data
      sizeGB: 1
