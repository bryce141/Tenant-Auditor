<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tenant Auditor{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#3b82f6', dark: '#2563eb' }
          }
        }
      }
    }
  </script>
  <style>
    [x-cloak] { display: none !important; }
    .nav-link { @apply flex items-center gap-2.5 px-3 py-2 rounded-lg text-slate-400 text-sm font-medium transition-colors hover:bg-slate-700/50 hover:text-slate-100; }
    .nav-link.active { @apply bg-slate-700/60 text-slate-100; }
    .nav-section { @apply text-xs font-semibold text-slate-500 uppercase tracking-wider px-3 mb-1 mt-4; }
    .card { @apply bg-slate-800 rounded-xl border border-slate-700/50; }
    .badge-pass   { @apply bg-emerald-500/20 text-emerald-400 border border-emerald-500/30; }
    .badge-warn   { @apply bg-amber-500/20   text-amber-400   border border-amber-500/30; }
    .badge-fail   { @apply bg-red-500/20     text-red-400     border border-red-500/30; }
    .badge-skip   { @apply bg-slate-600/40   text-slate-400   border border-slate-600; }
    .badge-info   { @apply bg-blue-500/20    text-blue-400    border border-blue-500/30; }
    .status-dot-pass { @apply bg-emerald-400; }
    .status-dot-warn { @apply bg-amber-400; }
    .status-dot-fail { @apply bg-red-400; }
    .status-dot-skip { @apply bg-slate-500; }
    .status-dot-info { @apply bg-blue-400; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-56 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col h-screen sticky top-0 overflow-y-auto">
    <!-- Logo -->
    <div class="px-4 py-5 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
        </div>
        <span class="font-bold text-slate-100 text-sm">Tenant Auditor</span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 py-3">
      <a href="{{ url_for('dashboard.index') }}" class="nav-link {{ 'active' if request.endpoint == 'dashboard.index' }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        Dashboard
      </a>

      <p class="nav-section">Security</p>
      <a href="{{ url_for('security.index') }}" class="nav-link {{ 'active' if 'security' in request.endpoint }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Security
      </a>

      <p class="nav-section">M365</p>
      <a href="{{ url_for('licensing.index') }}" class="nav-link {{ 'active' if 'licensing' in request.endpoint }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Licensing
      </a>
      <a href="{{ url_for('users.index') }}" class="nav-link {{ 'active' if 'users' in request.endpoint }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Users
      </a>
      <a href="{{ url_for('sharepoint.index') }}" class="nav-link {{ 'active' if 'sharepoint' in request.endpoint }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
        SharePoint
      </a>
      <a href="{{ url_for('exchange.index') }}" class="nav-link {{ 'active' if 'exchange' in request.endpoint }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        Exchange
      </a>
      <a href="{{ url_for('groups.index') }}" class="nav-link {{ 'active' if 'groups' in request.endpoint }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Groups
      </a>

      <p class="nav-section">History</p>
      <a href="{{ url_for('reports.index') }}" class="nav-link {{ 'active' if 'reports' in request.endpoint }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        Reports
      </a>
      <a href="{{ url_for('settings.index') }}" class="nav-link {{ 'active' if 'settings' in request.endpoint }}">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
        Settings
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 min-w-0 flex flex-col">
    {% block content %}{% endblock %}
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
    <div id="toast-inner" class="px-4 py-3 rounded-lg text-sm font-medium shadow-lg border"></div>
  </div>

  <script>
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      const inner = document.getElementById('toast-inner');
      inner.textContent = msg;
      inner.className = type === 'error'
        ? 'px-4 py-3 rounded-lg text-sm font-medium shadow-lg border bg-red-900/80 text-red-200 border-red-700'
        : 'px-4 py-3 rounded-lg text-sm font-medium shadow-lg border bg-emerald-900/80 text-emerald-200 border-emerald-700';
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    async function runReport(url, btnId, statusUrl) {
      const btn = document.getElementById(btnId);
      if (btn) { btn.disabled = true; btn.textContent = 'Running…'; }
      try {
        const r = await fetch(url, { method: 'POST' });
        const data = await r.json();
        if (data.status === 'started') {
          showToast('Report started — this may take a minute. Refresh when done.');
          if (statusUrl) { pollStatus(statusUrl, btnId); }
        } else {
          showToast(data.status === 'already_running' ? 'Already running…' : (data.error || 'Error'), 'error');
          if (btn) { btn.disabled = false; btn.textContent = 'Run Report'; }
        }
      } catch(e) {
        showToast('Request failed', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Run Report'; }
      }
    }

    function pollStatus(url, btnId) {
      const interval = setInterval(async () => {
        try {
          const r = await fetch(url);
          const data = await r.json();
          if (!data.running) {
            clearInterval(interval);
            showToast('Report complete! Refreshing…');
            setTimeout(() => location.reload(), 1000);
          }
        } catch(e) { clearInterval(interval); }
      }, 3000);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
