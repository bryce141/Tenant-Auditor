<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Tenant Auditor{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#3b82f6', dark: '#2563eb' }
          }
        }
      }
    }
  </script>
  <style>
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 10px; border-radius: 8px;
      color: #94a3b8; font-size: 13px; font-weight: 500;
      transition: background 0.15s, color 0.15s;
      text-decoration: none;
    }
    .nav-link:hover { background: rgba(51,65,85,0.5); color: #e2e8f0; }
    .nav-link.active { background: rgba(59,130,246,0.15); color: #93c5fd; }
    .nav-link.active svg { color: #60a5fa; }
    .nav-section {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: #475569; text-transform: uppercase;
      padding: 0 10px; margin: 20px 0 4px;
    }
    .card { background: #1e293b; border-radius: 12px; border: 1px solid rgba(51,65,85,0.6); }
    .metric-card {
      background: #1e293b; border-radius: 12px; border: 1px solid rgba(51,65,85,0.6);
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      text-decoration: none; display: block;
    }
    .metric-card:hover {
      border-color: rgba(59,130,246,0.4);
      background: #1e3a5f;
      transform: translateY(-1px);
    }
    .badge-pass   { background: rgba(16,185,129,0.1); color: #34d399; border: 1px solid rgba(16,185,129,0.2); border-radius: 4px; }
    .badge-warn   { background: rgba(245,158,11,0.1); color: #fbbf24; border: 1px solid rgba(245,158,11,0.2); border-radius: 4px; }
    .badge-fail   { background: rgba(239,68,68,0.1);  color: #f87171; border: 1px solid rgba(239,68,68,0.2);  border-radius: 4px; }
    .badge-skip   { background: rgba(71,85,105,0.3);  color: #94a3b8; border: 1px solid #334155;              border-radius: 4px; }
    .badge-info   { background: rgba(59,130,246,0.1); color: #60a5fa; border: 1px solid rgba(59,130,246,0.2); border-radius: 4px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-52 shrink-0 bg-slate-900 border-r border-slate-800 flex flex-col h-screen sticky top-0 overflow-y-auto">
    <!-- Logo -->
    <div class="px-4 pt-5 pb-4 border-b border-slate-800/60">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center shrink-0">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.955 11.955 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
          </svg>
        </div>
        <div>
          <p class="font-bold text-slate-100 text-sm leading-tight">Tenant Auditor</p>
          <p class="text-xs text-slate-500 leading-tight">M365 Intelligence</p>
        </div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 py-3 space-y-0.5">
      <a href="{{ url_for('dashboard.index') }}" class="nav-link {{ 'active' if request.endpoint == 'dashboard.index' }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v2a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 15a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H5a1 1 0 01-1-1v-4zm10-3a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1v-7z"/>
        </svg>
        Dashboard
      </a>

      <p class="nav-section">Security</p>
      <a href="{{ url_for('security.index') }}" class="nav-link {{ 'active' if 'security' in request.endpoint }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Security
      </a>

      <p class="nav-section">M365</p>
      <a href="{{ url_for('licensing.index') }}" class="nav-link {{ 'active' if 'licensing' in request.endpoint }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
        </svg>
        Licensing
      </a>
      <a href="{{ url_for('users.index') }}" class="nav-link {{ 'active' if 'users' in request.endpoint }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Users
      </a>
      <a href="{{ url_for('sharepoint.index') }}" class="nav-link {{ 'active' if 'sharepoint' in request.endpoint }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
        </svg>
        SharePoint
      </a>
      <a href="{{ url_for('exchange.index') }}" class="nav-link {{ 'active' if 'exchange' in request.endpoint }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        Exchange
      </a>
      <a href="{{ url_for('groups.index') }}" class="nav-link {{ 'active' if 'groups' in request.endpoint }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        Groups
      </a>

      <p class="nav-section">History</p>
      <a href="{{ url_for('reports.index') }}" class="nav-link {{ 'active' if 'reports' in request.endpoint }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Reports
      </a>

      <p class="nav-section">Config</p>
      <a href="{{ url_for('settings.index') }}" class="nav-link {{ 'active' if 'settings' in request.endpoint }}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        Settings
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 min-w-0 flex flex-col">
    {% block content %}{% endblock %}
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
    <div id="toast-inner" class="px-4 py-3 rounded-lg text-sm font-medium shadow-xl border"></div>
  </div>

  <script>
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      const inner = document.getElementById('toast-inner');
      inner.textContent = msg;
      inner.className = type === 'error'
        ? 'px-4 py-3 rounded-lg text-sm font-medium shadow-xl border bg-red-900/80 text-red-200 border-red-700'
        : 'px-4 py-3 rounded-lg text-sm font-medium shadow-xl border bg-emerald-900/80 text-emerald-200 border-emerald-700';
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    async function runReport(url, btnId, statusUrl) {
      const btn = document.getElementById(btnId);
      if (btn) { btn.disabled = true; btn.textContent = 'Running…'; }
      try {
        const r = await fetch(url, { method: 'POST' });
        const data = await r.json();
        if (data.status === 'started') {
          showToast('Report started — refreshing when done.');
          if (statusUrl) { pollStatus(statusUrl, btnId); }
        } else {
          showToast(data.status === 'already_running' ? 'Already running…' : (data.error || 'Error'), 'error');
          if (btn) { btn.disabled = false; btn.textContent = 'Run Report'; }
        }
      } catch(e) {
        showToast('Request failed', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Run Report'; }
      }
    }

    function pollStatus(url, btnId) {
      const interval = setInterval(async () => {
        try {
          const r = await fetch(url);
          const data = await r.json();
          if (!data.running) {
            clearInterval(interval);
            showToast('Report complete! Refreshing…');
            setTimeout(() => location.reload(), 1000);
          }
        } catch(e) { clearInterval(interval); }
      }, 3000);
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
